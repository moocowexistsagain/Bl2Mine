name: build

on:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run protocol and BL2 tests
        run: |
          python tools/protocol_selftest.py
          python tools/test_bridge_lifecycle.py
          python tools/test_host_adapter.py
          python tools/test_skin_renderer.py
          python tools/mirror_check.py
          python -m compileall -q bl2sdk protocol/python tools

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Fabric mod
        working-directory: fabric
        run: ./gradlew build --no-daemon

      - name: Check built jar bytecode
        run: python tools/jar_check.py fabric/build/libs/bordercraft-0.1.0.jar

      - name: Upload installable Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: bordercraft-fabric-1.21.1
          path: fabric/build/libs/bordercraft-0.1.0.jar
          if-no-files-found: error
