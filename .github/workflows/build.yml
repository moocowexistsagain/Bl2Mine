name: build

on:
  workflow_dispatch:
  push:
    branches: [main, "arena/**"]
  pull_request:

permissions:
  contents: write

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run protocol and BL2 tests
        run: |
          python tools/protocol_selftest.py
          python tools/test_bridge_lifecycle.py
          python tools/test_host_adapter.py
          python tools/test_compositor.py
          python tools/test_model_renderer.py
          python tools/test_voxel_field.py
          python tools/test_hud_renderer.py
          python tools/test_input_bridge.py
          python tools/test_collision_export.py
          python tools/mirror_check.py
          python tools/package_bl2.py --output-dir "${RUNNER_TEMP}/bordercraft-package"
          python -m compileall -q bl2sdk protocol/python tools

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Build Fabric mod
        working-directory: fabric
        run: ./gradlew build --no-daemon

      - name: Check built jar bytecode
        run: python tools/jar_check.py fabric/build/libs/bordercraft-0.1.0.jar

      # Keep release/ usable for people who install from the repository without a JDK, and keep
      # the BL2 packages in lockstep with the protocol source - a stale package on either side
      # leaves the bridge silent. Commits made by GITHUB_TOKEN do not recursively trigger this
      # workflow.
      - name: Refresh prebuilt artifacts on Arena branches
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/arena/')
        run: |
          cp fabric/build/libs/bordercraft-0.1.0.jar release/bordercraft-0.1.0.jar
          cp "${RUNNER_TEMP}/bordercraft-package/BorderCraft.sdkmod" release/BorderCraft.sdkmod
          rm -f release/BorderCraft-*-legacy.zip
          cp "${RUNNER_TEMP}"/bordercraft-package/BorderCraft-*-legacy.zip release/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add release/
          if ! git diff --cached --quiet; then
            git commit -m "Update prebuilt BorderCraft artifacts"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi

      - name: Upload installable Fabric jar
        uses: actions/upload-artifact@v4
        with:
          name: bordercraft-fabric-1.21.1
          path: fabric/build/libs/bordercraft-0.1.0.jar
          if-no-files-found: error
